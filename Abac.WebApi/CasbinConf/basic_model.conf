# 这是请求定义部分
[request_definition]
r = sub, obj, act  # sub: 主体, obj: 资源, act: 操作

# 这是策略定义部分  
[policy_definition]
p = sub, obj, act  # 策略规则格式

# 策略效果定义
[policy_effect]
e = some(where (p.eft == allow))  # 只要有一个策略允许就允许

# 匹配器定义
[matchers]
# 使用正则表达式进行不区分大小写匹配
m = r.sub == p.sub && regexMatch(r.obj, "(?i)" + p.obj) && regexMatch(r.act, "(?i)" + p.act)
